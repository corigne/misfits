name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: jodoin-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Deploy artifacts via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.PORT }}" \
            frontend/build/ frontend/package.json frontend/package-lock.json \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/home/nexus/${{ secrets.DOMAIN }}/

      - name: Install deps and restart service
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.PORT }} \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} '
            export PATH="/home/nexus/.local/share/fnm/node-versions/v22.4.1/installation/bin:$PATH"
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            cd /home/nexus/jodoin.io
            npm ci --omit=dev
            systemctl --user restart jodoin.io.service
          '
